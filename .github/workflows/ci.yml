name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # BLAST+ for the end-to-end test of `discover blast`. The Ubuntu
      # package is older than the versions the program accepts.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: blast
          create-args: blast=2.16
          condarc: |
            channels:
              - conda-forge
              - bioconda
          cache-environment: true
      - name: Put BLAST+ on the PATH
        run: |
          echo "$MAMBA_ROOT_PREFIX/envs/blast/bin" >> "$GITHUB_PATH"
          "$MAMBA_ROOT_PREFIX/envs/blast/bin/blastn" -version
      - name: Unit and end-to-end tests
        run: cargo test --locked
        env:
          # A missing blastn fails the end-to-end test instead of skipping it.
          IMMUNEDISCOVER_REQUIRE_BLAST: "1"
