[package]
name = "immunediscover"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "Germline immune receptor allele discovery from NGS data (Rust port of immunediscover.jl)"
license = "MIT"
authors = ["Mateusz Kaduk <mateusz.kaduk@gmail.com> and contributors"]

[lib]
name = "immunediscover"
path = "src/lib.rs"

[[bin]]
name = "immunediscover"
path = "src/main.rs"

[[bin]]
name = "ki-check"
path = "src/bin/ki_check.rs"

[dependencies]
aho-corasick = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.14"
flate2 = "1"
glob = "0.3"
libm = "0.2"
md-5 = "0.10"
memchr = "2"
rand = "0.8"
rayon = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
